  flutter_dotenv: ^5.1.0
  equatable: ^2.0.5
  intl: ^0.19.0
  uuid: ^4.4.2
  dio: ^5.5.0+1
  path_provider: ^2.1.4
  path: ^1.9.0
  xml: ^6.5.0
  aws_signature_v4: ^0.6.0
